name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security issues —
        see [SECURITY.md](https://github.com/Uk2317/TaskFlow/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: Creating a task with an attachment returns 500 instead of the created task.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '...'
        2. Click '...'
        3. See the error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Backend (API)
        - Frontend (web)
        - Both
        - Deployment / configuration
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, error output or screenshots
      description: API response body, browser console, or terminal output. Redact any tokens.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, browser, and whether you run locally or against the deployed app.
      placeholder: Node 20.11, macOS 14, Chrome 122, local dev

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest `main` (or I have stated my version above).
          required: true
